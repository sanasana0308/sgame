<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我熱愛當瑜伽老師🙃｜三明治鎮</title>
<meta name="description" content="大家都被夾成三明治了，換你來幫大家鬆一鬆。">
<meta property="og:title" content="我熱愛當瑜伽老師🙃｜三明治鎮">
<meta property="og:description" content="玩完一區，等於上了一堂迷你瑜伽課。">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@500;600;700&display=swap">
<style>
:root{--yellow:#ffc233;--tomato:#d7263d;--lettuce:#7fa63d;--ink:#2c2c2a;--stone:#888780;--cream:#efeae3;--soft:#f7f3ee;--yellow-soft:#fff1cc;--lettuce-soft:#e9f1dc;color-scheme:light}
html,body{background:var(--cream);margin:0}
body{color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65}
.ribbon{height:22px;background:linear-gradient(90deg,var(--yellow) 0 32%,var(--tomato) 32% 57%,var(--ink) 57% 80%,var(--lettuce) 80% 100%);
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7.5px) 0 0/20px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7.5px) 0 0/20px 100% repeat-x}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
.kicker{font-family:Poppins,sans-serif;font-size:12px;letter-spacing:.16em;color:var(--stone);text-transform:uppercase;margin:0}
h1{font-size:30px;font-weight:900;line-height:1.2;margin:0;text-wrap:balance}
.lead{margin:0;font-size:16px}
a.game{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--ink);transition:transform .08s}
a.game:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
a.game.main{background:var(--yellow-soft)}
.ic{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--soft)}
.ic svg{width:48px;height:48px}
.g b{display:block;font-size:19px;font-weight:900;line-height:1.3}
.g>span{display:block;font-size:14px;color:var(--stone);line-height:1.45}
.g .tag{display:inline-block;width:auto;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--tomato);color:#fff;margin-left:4px;vertical-align:2px}
.small{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small a.game{flex-direction:column;align-items:flex-start;gap:8px;box-shadow:0 3px 0 var(--ink);border-width:2px}
.small .ic{width:44px;height:44px;border-radius:12px}.small .ic svg{width:32px;height:32px}
.small .g b{font-size:16px}
.who{background:#fff;border-radius:18px;padding:14px 16px}
.who h2{font-size:16px;margin:0 0 4px}
.who p{margin:0;font-size:15px}
.foot{font-size:12px;color:var(--stone);text-align:center;margin:0}
@media (max-width:360px){.small{grid-template-columns:1fr}}
.igbtn{display:inline-block;margin-top:10px;background:var(--yellow);color:var(--ink);font-weight:900;text-decoration:none;border:2px solid var(--ink);border-radius:99px;padding:8px 16px}
.hsub{margin:-6px 0 0;font-size:18px;font-weight:700;color:var(--tomato)}
</style>
</head>
<body>
<div class="ribbon" aria-hidden="true"></div>
<main class="wrap">
  <p class="kicker">Sandywich Yoga · 三明治鎮</p>
  <h1>我熱愛當瑜伽老師🙃</h1>
  <p class="hsub">大家都被夾成三明治了，<br>換你來幫大家鬆一鬆</p>
  <p class="lead">歡迎來到三明治鎮。玩一局大約 5 分鐘，像上了一堂迷你瑜伽課。每個月開放新的一區。</p>

  <a class="game main" href="/town">
    <span class="ic"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 52 L10 26 C4 24 4 12 16 10 C24 4 40 4 48 10 C60 12 60 24 54 26 L54 52 Z" fill="#e8b46a" stroke="#2c2c2a" stroke-width="3" stroke-linejoin="round"/><path d="M14 30 q6 -5 12 0 t12 0 t12 0 L50 36 L14 36Z" fill="#7fa63d" stroke="#2c2c2a" stroke-width="2.5"/><rect x="14" y="38" width="36" height="7" rx="3" fill="#d7263d" stroke="#2c2c2a" stroke-width="2.5"/></svg></span>
    <span class="g"><b>開始上工 <span class="tag">第一區・極致肩持</span></b><span>救回 3 位居民，解鎖這一區的序列圖卡。</span></span>
  </a>

  <section class="who">
    <h2>Sandy 是誰？</h2>
    <p>RYT200 瑜伽老師，喜歡把身體的感覺說清楚。遊戲裡的動作和口令，都來自 Sandy 的課。</p>
    <a class="igbtn" href="https://www.instagram.com/sandywich.su/" target="_blank" rel="noopener">追蹤 @sandywich.su，看每週的序列</a>
  </section>
  <p class="foot">遊戲好玩為主，這不是治療；身體有傷痛，請先詢問醫師。</p>
</main>
</body>
</html>
