<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心情除錯所｜Sandywich</title>
<meta name="description" content="下課 10 分鐘，當一次資訊社的心情工程師：讀懂同學的情緒，幫他們除錯。">
<meta property="og:title" content="心情除錯所｜下課 10 分鐘的心情工程師">
<meta property="og:description" content="五位同學的系統出錯了。溫度在升、電量在掉，你先救誰？">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone column on light "graph paper" — clock + battery HUD, square school map (canvas), then the student status list.
   Dialogs and mini-games open in a bottom sheet. Deliberate single light theme with code-flavoured accents. */
:root{
  --bg:#F5F2EA; --paper:#FFFFFF; --ink:#23303F; --muted:#6A7484; --line:#DCD6CA; --soft:#F8F6F1;
  --kw:#3B6FD8; --ok:#1F9D74; --ok-soft:#E3F4EC; --warn:#E8962E; --warn-soft:#FDF0DC; --hot:#E5484D; --hot-soft:#FCE5E5;
  --violet:#8C6BD1; --grid:rgba(59,111,216,.06);
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-d:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-zh);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--kw);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-d);font-weight:400;text-wrap:balance}
code,.mono{font-family:var(--f-code)}
.wrap{max-width:520px;margin:0 auto;padding:10px max(12px,env(safe-area-inset-right,0px)) 30px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.homeLink{align-self:flex-start;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 0;min-height:32px}
.homeLink:hover{color:var(--ink)}
.top{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.brand b{font-family:var(--f-d);font-weight:400;font-size:21px}
.brand span{font-family:var(--f-code);font-size:11px;color:var(--muted)}
.clock{font-family:var(--f-code);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:0 10px;box-shadow:0 3px 0 var(--ink)}
.clock.late{color:var(--hot)}
.hud{background:var(--paper);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 var(--line)}
.hrow{display:flex;align-items:center;gap:8px}
.lab{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.bbar{flex:1;height:12px;border-radius:99px;background:var(--soft);border:2px solid var(--ink);overflow:hidden;position:relative}
.bbar i{display:block;height:100%;background:var(--ok);transition:width .25s,background .25s}
.bbar.low i{background:var(--hot)}
.bbar::after{content:"";position:absolute;left:30%;top:0;bottom:0;border-left:2px dashed rgba(35,48,63,.35)}
.batN{font-family:var(--f-code);font-weight:700;font-size:14px;min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums}
.batN.low{color:var(--hot)}
.tools{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px 1px 3px;background:var(--soft);color:var(--muted);border:1.5px dashed var(--line);white-space:nowrap}
.tl svg{width:18px;height:18px}
.tl.got{background:var(--warn-soft);color:var(--ink);border:1.5px solid var(--ink)}
.tl.off svg{opacity:.3;filter:grayscale(1)}
.tl.pop{animation:pop .6s ease 2}
@keyframes pop{50%{transform:scale(1.15)}}
.cnt{font-family:var(--f-code);font-size:12px;color:var(--muted);white-space:nowrap}
.cnt b{color:var(--ink)}
.endEarly{border:0;background:var(--ok);color:#fff;font-weight:700;border-radius:12px;padding:10px 14px;min-height:44px}
.main{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#E9EEDF;touch-action:manipulation;box-shadow:0 0 0 3px var(--ink)}
#cv{display:block;width:100%;height:auto}
.toast{pointer-events:none;position:absolute;left:8px;right:8px;bottom:8px;background:var(--paper);border-radius:12px;padding:7px 12px;font-size:14px;line-height:1.45;box-shadow:0 6px 16px -8px rgba(0,0,0,.45);transition:opacity .3s;border-left:4px solid var(--kw)}
.toast.bad{border-left-color:var(--hot)}
.toast.good{border-left-color:var(--ok)}
.list h3{font-size:16px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.list h3 span{font-family:var(--f-code);font-size:12px;color:var(--muted)}
.studs{display:flex;flex-direction:column;gap:6px}
.stu{display:grid;grid-template-columns:40px 1fr 54px;align-items:center;gap:8px;background:var(--paper);border:0;border-radius:12px;padding:6px 10px;text-align:left;min-height:52px;width:100%}
.stu .av svg{width:40px;height:40px;display:block}
.stu .t{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.stu .t b{font-size:14px}
.stu .t b small{font-weight:500;color:var(--muted);font-size:11px;margin-left:4px}
.stu code{font-size:11px;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu .tp{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stu .tp b{font-family:var(--f-code);font-size:14px;font-variant-numeric:tabular-nums}
.tbar{width:54px;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--warn)}
.stu.hot code,.stu.hot .tp b{color:var(--hot)}
.stu.hot .tbar i{background:var(--hot)}
.stu.crash{background:var(--hot-soft);animation:shake .4s linear infinite}
.stu.crash code,.stu.crash .tp b{color:var(--hot);font-weight:700}
.stu.crash .tbar i{background:var(--hot)}
.stu.fixed{background:var(--ok-soft)}
.stu.fixed code,.stu.fixed .tp b{color:var(--ok);font-weight:700}
.stu.fixed .tbar i{background:var(--ok)}
.stu.ghost{opacity:.45}
@keyframes shake{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.help{font-size:12px;color:var(--muted);margin:0}
.foot{font-size:12px;color:var(--muted);margin:0;text-align:center}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(35,48,63,.42);display:flex;align-items:flex-end;justify-content:center;padding:10px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
.panel{background:var(--paper);border-radius:20px;width:100%;max-width:500px;max-height:100%;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.ph .av svg{width:48px;height:48px;display:block}
.ph .who{flex:1;min-width:0;line-height:1.3}
.ph b{font-size:17px}
.ph b small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.ph code{display:block;font-size:12px;color:var(--hot);overflow-wrap:anywhere}
.ph code.fixed{color:var(--ok)}
.ph .tmp{font-family:var(--f-code);font-weight:700;font-size:15px;color:var(--warn);white-space:nowrap}
.pb{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.see{margin:0;font-size:15px;color:var(--muted)}
.see b{color:var(--ink)}
.say{margin:0;font-size:16px;background:var(--soft);border-radius:4px 16px 16px 16px;padding:9px 13px}
.q{font-size:13px;font-weight:700;color:var(--kw);font-family:var(--f-code)}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:9px 13px;font-size:15px;min-height:46px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt small{display:block;font-size:12px;color:var(--hot)}
.opt:disabled{cursor:default;opacity:.55}
.opt.pick{opacity:1;border-color:var(--ink);background:var(--soft)}
.opt.g-best{border-color:var(--ok);background:var(--ok-soft)}
.opt.g-bad{border-color:var(--hot);background:var(--hot-soft)}
.words{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.words .opt{text-align:center;font-size:18px;font-weight:700}
.fb{background:var(--warn-soft);border-radius:14px;padding:10px 13px;display:flex;flex-direction:column;gap:4px}
.fb p{margin:0;font-size:15px}
.fb .fx{font-family:var(--f-code);font-size:12px;color:var(--muted)}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--hot-soft)}
.clue{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.clue div{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.45}
.clue i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--kw);font-family:var(--f-code)}
.primary{background:var(--ink);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:16px;min-height:48px}
.primary.go{background:var(--ok)}
.ghost{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;min-height:46px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 130px}
.eyebrow{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:99px;background:var(--kw);color:#fff;font-family:var(--f-code)}
.lead{margin:0;font-size:16px}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.small{font-size:13px;color:var(--muted);margin:0}

/* mini-games: pointer events, finger + mouse */
.mg-h{display:flex;flex-direction:column;line-height:1.35}
.mg-h b{font-family:var(--f-d);font-weight:400;font-size:20px}
.mg-h span{font-size:14px;color:var(--muted)}
.mg-time{height:7px;border-radius:99px;background:var(--soft);overflow:hidden}
.mg-time i{display:block;height:100%;width:100%;background:var(--kw)}
.mg-res{margin:0;font-weight:700;min-height:1.5em;color:var(--ok)}
.chip{min-height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:15px;padding:6px 12px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 3px 0 var(--ink);position:relative}
.chip.drag{z-index:5;box-shadow:0 8px 16px -6px rgba(0,0,0,.45);cursor:grabbing}
.chip.sel{background:var(--warn-soft);outline:3px solid var(--warn)}
.chip:disabled{box-shadow:none;opacity:.6}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;align-items:flex-start}
.bigblock{width:100%;min-height:72px;border:2px solid var(--ink);border-radius:14px;background:var(--hot-soft);font-family:var(--f-d);font-size:26px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.bigblock small{font-family:var(--f-zh);font-size:13px;color:var(--muted)}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:8px;min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:4px 10px;background:var(--soft)}
.slot i{font-style:normal;font-family:var(--f-code);font-weight:700;color:var(--kw);width:1.2em}
.slot span{font-weight:700}
.slot.on{border-style:solid;border-color:var(--ink);background:var(--warn-soft)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bin{min-height:120px;border:2px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--soft);cursor:pointer}
.bin b{font-family:var(--f-code);font-size:15px}
.bin[data-b="f"] b{color:var(--kw)}
.bin[data-b="g"] b{color:var(--violet)}
.bin small{font-size:11px;color:var(--muted)}
.bin .in{display:flex;flex-direction:column;gap:4px}
.bin .in span{font-size:13px;background:var(--paper);border-radius:8px;padding:3px 6px;border:1.5px solid var(--line)}
.bin .in span.no{border-color:var(--hot)}
.bin.hi{border-color:var(--warn);background:var(--warn-soft)}
.card{font-size:14px;text-align:left;font-weight:500}
.scene{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scene svg{display:block;width:100%;height:auto}
.scene .it{cursor:pointer}
.scene .it.found .mark{opacity:1}
.scene .mark{opacity:0;transition:opacity .2s}
.gcount{font-family:var(--f-code);font-weight:700;font-size:15px}
.codebox{background:#1F2A37;color:#E6EDF3;border-radius:14px;padding:10px 12px;font-family:var(--f-code);font-size:14px;display:flex;flex-direction:column;gap:6px}
.codebox .ln{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.codebox .kw{color:#7FB2FF}
.codebox .cm{color:#8B98A8}
.blank{display:inline-flex;align-items:center;min-width:92px;min-height:38px;border-radius:8px;border:2px dashed #5C6B7D;padding:2px 8px;font-family:var(--f-zh);font-weight:700;color:#FFD47A;cursor:pointer}
.blank.on{border-style:solid;border-color:#FFD47A}
.breath{position:relative;height:190px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--soft);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.ring{position:absolute;width:160px;height:160px;border-radius:50%;border:4px solid var(--kw);transform:scale(.55)}
.ring-core{width:100px;height:100px;border-radius:50%;background:var(--kw);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;transform:scale(.72);transition:transform .25s;text-align:center;line-height:1.25}
.breath.on .ring-core{transform:scale(1);background:var(--ok)}
.sync{font-family:var(--f-code);font-size:13px;color:var(--muted);text-align:center;margin:0}

/* report */
.term{background:#FBFAF6;border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.term .bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ink);color:#fff;font-family:var(--f-code);font-size:12px}
.term .bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
.term .body{padding:12px 14px;font-family:var(--f-code);font-size:13px;line-height:1.7;display:flex;flex-direction:column;gap:2px}
.term .body .p{color:var(--kw)}
.term .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line)}
.term .kv b{font-variant-numeric:tabular-nums}
.term .ok{color:var(--ok)}
.term .er{color:var(--hot)}
.graph svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.badge{border-radius:12px;border:2px solid var(--ink);background:var(--warn-soft);padding:6px;text-align:center;display:flex;flex-direction:column;gap:2px;line-height:1.3}
.badge b{font-size:13px}
.badge small{font-size:11px;color:var(--muted)}
.badge.off{border:2px dashed var(--line);background:var(--soft);color:var(--muted)}
.badge.new{background:var(--ok-soft)}
.style{border-radius:16px;background:var(--ok-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.style h2{font-size:24px}
.style ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:15px}
.style .cost,.style .tip{margin:0;font-size:15px}
.style .tip{border-top:2px dashed rgba(31,157,116,.35);padding-top:6px}
.style .tip i,.style .cost i{font-style:normal;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;margin-right:4px;color:#fff}
.style .cost i{background:var(--warn)}
.style .tip i{background:var(--ok)}
.care{margin:0;font-size:15px;background:var(--soft);border-radius:12px;padding:10px 12px;border-left:4px solid var(--violet)}
.console{background:#1F2A37;color:#E6EDF3;border-radius:14px;padding:12px;font-family:var(--f-code);font-size:14px;display:flex;flex-direction:column;gap:8px}
.console .kw{color:#7FB2FF}
.console .cm{color:#9FD8B9}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.moods button{background:#2B3949;color:#FFD47A;border:1.5px solid #4A5A6E;border-radius:10px;padding:6px 10px;min-height:44px;font-family:var(--f-zh);font-weight:700}
.moods button.on{background:#FFD47A;color:#1F2A37}
.copied{font-size:13px;color:var(--ok);min-height:1.2em;margin:0}
.dict{display:flex;flex-direction:column;gap:8px}
.page{border-radius:14px;border:2px solid var(--ink);background:var(--paper);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.page h3{font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.page h3 code{font-size:12px;color:var(--kw)}
.page p{margin:0;font-size:14px}
.page p i{font-style:normal;font-weight:700;font-size:12px;color:var(--muted);margin-right:4px}
.page.lock{border-style:dashed;border-color:var(--line);color:var(--muted);background:var(--soft)}
@media (min-width:900px){.wrap{max-width:1040px}.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;align-items:start;gap:16px}.stage{width:min(100%,calc(100vh - 210px));justify-self:center}}
@media (min-width:700px) and (min-height:600px){.sheet{align-items:center}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.stu.crash{animation:none}.ring-core{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="homeLink" href="/">‹ 回首頁</a>
  <div class="top">
    <div class="brand"><b>心情除錯所</b><span>mood-debugger v2 · 資訊社</span></div>
    <div class="clock" id="clock" aria-live="off">10:00:00</div>
  </div>
  <div class="hud" id="hud">
    <div class="hrow"><span class="lab">你的電量</span><div class="bbar" id="bbar"><i id="batI" style="width:100%"></i></div><span class="batN" id="batN">100%</span></div>
    <div class="hrow"><span class="lab">工具</span><div class="tools" id="tools"></div></div>
    <div class="hrow"><span class="cnt">Fixed <b id="fixN">0/5</b></span><span class="cnt">貼紙 <b id="stkN">0/3</b></span><span class="cnt" id="statusN" style="flex:1;text-align:right"></span><button class="endEarly" id="endEarly" hidden>提早收工</button></div>
  </div>
  <div class="main">
    <div class="stage" id="stageMap">
      <canvas id="cv" aria-label="校園地圖：點地圖走路，點同學或地點就會走過去"></canvas>
      <div class="toast" id="toast">按「開始下課」。</div>
    </div>
    <div class="list">
      <h3>同學狀態 <span>溫度到 100° 會當機</span></h3>
      <div class="studs" id="studs"></div>
      <p class="help" style="margin-top:8px">點地圖走路，點同學（或他頭上的溫度）就會走過去。點地點可以拿工具、充電。電腦可用方向鍵走路、E 互動。</p>
    </div>
  </div>
  <p class="foot">遊戲裡的方法，是常見的情緒調節練習，不是治療。<br>心情一直不好，找導師或輔導老師聊聊。</p>
</div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<script>

    apOrder:shuffle(d.ap.map((_,i)=>i)),apG:null,wG:null,mgG:null,score:0,asked:false}));

  ST={phase:'intro',t:0,bat:100,minBat:100,tools:{},toolAsk:{},stickers:[],down:0,pendingCrash:false,with:null,evQ:[],
    events:[{id:'group',at:Math.round(rnd(140,220))},{id:'rumor',at:Math.round(rnd(280,330))},{id:'teacher',at:360}],

const people=()=>TEACH.present?[...STU,TEACH]:STU;
const fixedN=()=>STU.filter(s=>s.fixed).length;
const toolCount=()=>Object.keys(ST.tools).length;
const fmtClock=t=>{const s=Math.min(600,Math.floor(t));return `10:${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};

// ================= 路徑 =================
function blocked(x,y){if(x<0||y<0||x>=W||y>=H)return true;if(!walkable(grid[y][x]))return true;return people().some(p=>p.x===x&&p.y===y);}
function bfs(sx,sy,goal){
  if(goal(sx,sy))return [];
  const K=(x,y)=>y*W+x,start=K(sx,sy),prev=new Map([[start,-1]]),q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(blocked(nx,ny))continue;const k=K(nx,ny);if(prev.has(k))continue;prev.set(k,K(x,y));
    if(goal(nx,ny)){const path=[];let c=k;while(c!==start){path.unshift([c%W,(c/W)|0]);c=prev.get(c);}return path;}q.push([nx,ny]);}}
  return null;
}
const adjTo=(x,y,tx,ty)=>Math.abs(tx-x)+Math.abs(ty-y)===1;
function adjBld(b,x,y){for(let yy=b.y0;yy<=b.y1;yy++)for(let xx=b.x0;xx<=b.x1;xx++)if(adjTo(x,y,xx,yy))return true;return false;}
function isAdj(tg,x,y){if(tg.kind==='npc')return adjTo(x,y,tg.n.x,tg.n.y);if(tg.kind==='bld')return adjBld(BLD[tg.key],x,y);return false;}
const ppos=()=>[Math.round(player.x),Math.round(player.y)];
function pathLen(n){const [px,py]=ppos();const p=bfs(px,py,(x,y)=>adjTo(x,y,n.x,n.y));return p?p.length:99;}

// ================= HUD / list =================
const $toast=$('toast');
function toast(t,kind){$toast.textContent=t;$toast.className='toast'+(kind?' '+kind:'');$toast.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$toast.style.opacity=0,5000);}
function renderTools(pop){
  $('tools').innerHTML=TOOL_ORDER.map(k=>{const g=!!ST.tools[k];return `<span class="tl ${g?'got':'off'} ${pop===k?'pop':''}" data-tool="${k}" title="${TOOLS[k].nm}">${toolSvg(k)}${g?TOOLS[k].nm:(ST.toolAsk[k]?TOOLS[k].nm+'？':'？')}</span>`;}).join('');
}
function renderHud(){
  const b=Math.round(ST.bat),low=ST.bat<30;
  $('batI').style.width=b+'%';$('bbar').classList.toggle('low',low);$('batN').textContent=b+'%';$('batN').classList.toggle('low',low);

  $('endEarly').hidden=!(ST.phase==='play'&&fixedN()===5);
}
function faceSvg(s,mood){
  mood=mood||moodOf(s);const skin='#F6D9C0',ink='#23303F';
  let eyes=`<circle cx="19" cy="25" r="1.8" fill="${ink}"/><circle cx="29" cy="25" r="1.8" fill="${ink}"/>`,mouth='';
  if(mood==='happy')mouth=`<path d="M19 30 Q24 35 29 30" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  else if(mood==='fake')mouth=`<path d="M19 30 Q24 34 29 30" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M33 18 q2 3 0 5 q-2 -2 0 -5" fill="#7FC4E8"/>`;
  else if(mood==='worry')mouth=`<path d="M20 32 Q22 30 24 32 T28 32" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  else if(mood==='sad')mouth=`<path d="M19 33 Q24 29 29 33" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  else if(mood==='angry'){mouth=`<path d="M19 33 Q24 29 29 33" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;eyes+=`<path d="M16 21l5 2M32 21l-5 2" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>`;}
  else if(mood==='crash'){eyes=`<path d="M17 23l4 4M21 23l-4 4M27 23l4 4M31 23l-4 4" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>`;mouth=`<path d="M20 32 L22 30 L24 32 L26 30 L28 32" stroke="${ink}" stroke-width="1.6" fill="none"/>`;}
  else mouth=`<path d="M20 31 H28" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>`;
  const hood=s.prop==='hood'?`<path d="M9 30 C8 12 40 12 39 30 L35 30 C35 18 13 18 13 30 Z" fill="${s.color}"/>`:'';
  const hair=s.prop==='hood'?'':s.teacher?`<circle cx="24" cy="11" r="5" fill="${s.hair}"/><path d="M13 24 C12 13 36 13 35 24 C32 18 16 18 13 24Z" fill="${s.hair}"/>`:`<path d="M13 24 C12 12 36 12 35 24 C30 17 18 17 13 24Z" fill="${s.hair}"/>`;
  const gl=s.prop==='glasses'?`<circle cx="19" cy="25" r="4" fill="none" stroke="${ink}" stroke-width="1.4"/><circle cx="29" cy="25" r="4" fill="none" stroke="${ink}" stroke-width="1.4"/><path d="M23 25h2" stroke="${ink}" stroke-width="1.4"/>`:'';
  const cheek=(mood==='crash'||mood==='angry'||(mood==='sad'&&s.prop==='hood'))?`<circle cx="16" cy="30" r="2.4" fill="#F28C8C" opacity=".7"/><circle cx="32" cy="30" r="2.4" fill="#F28C8C" opacity=".7"/>`:'';
  const bg=s.fixed?'#E3F4EC':mood==='crash'?'#FCE5E5':'#F8F6F1';
  return `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="${bg}"/><path d="M8 48 C8 36 40 36 40 48Z" fill="${s.color}"/>${hood}<circle cx="24" cy="26" r="11" fill="${skin}" stroke="${ink}" stroke-width="1.3"/>${hair}${cheek}${eyes}${mouth}${gl}</svg>`;
}
function moodOf(s){
  if(s.fixed)return 'happy';if(s.crashed)return 'crash';
  if(s.prop==='phone'&&s.temp<85)return 'fake';
  if(s.temp>=70)return (s.prop==='glasses'||s.prop==='ball'||s.teacher)?'angry':'sad';
  if(s.temp>=40)return 'worry';return 'calm';
}
function buildList(){
  $('studs').innerHTML=[...STU,TEACH].map(s=>`<button class="stu" data-id="${s.id}" ${s.teacher?'hidden':''}><span class="av"></span><span class="t"><b>${s.nm}<small>${s.tag}</small></b><code></code></span><span class="tp"><b></b><span class="tbar"><i></i></span></span></button>`).join('');
  $('studs').querySelectorAll('.stu').forEach(b=>b.addEventListener('click',()=>{const s=people().find(p=>p.id===b.dataset.id);if(s)goTo({kind:'npc',n:s});}));
  updateList(true);
}
function updateList(force){
  for(const s of [...STU,TEACH]){
    const el=$('studs').querySelector(`[data-id="${s.id}"]`);if(!el)continue;
    if(s.teacher)el.hidden=!s.present;
    const mood=moodOf(s),key=mood+'|'+s.fixed;
    if(force||el.dataset.k!==key){el.dataset.k=key;el.querySelector('.av').innerHTML=faceSvg(s,mood);}
    el.classList.toggle('fixed',s.fixed);el.classList.toggle('crash',!!s.crashed&&!s.fixed);el.classList.toggle('hot',!s.fixed&&!s.crashed&&s.temp>=75);
    el.querySelector('code').textContent=s.fixed?'✓ Fixed':s.crashed?'CRASHED · '+s.err:s.err;
    el.querySelector('.tp b').textContent=s.fixed?'✓':Math.round(s.temp)+'°';
    el.querySelector('.tbar i').style.width=(s.fixed?100:s.temp)+'%';
  }
}

// ================= 時間 / 溫度 / 電量 =================
function useBat(n){
  ST.bat=clamp(ST.bat-n,0,100);if(ST.bat<ST.minBat)ST.minBat=ST.bat;
  if(ST.bat<=0&&ST.down<=0&&ST.phase==='play'){if(sheetOpen)ST.pendingCrash=true;else crashPlayer();}
  renderHud();
}
function gainBat(n){ST.bat=clamp(ST.bat+n,0,100);renderHud();}
function crashPlayer(){
  ST.pendingCrash=false;ST.down=30;L.playerCrashes++;player.path=[];player.target=null;ST.bat=0;
  toast('電量 0%……你當機了。系統重新開機中（30 秒）。','bad');renderHud();
}
function advance(dg){
  if(ST.phase!=='play')return;
  ST.t+=dg;
  const late=ST.t>420?1.2:1;
  for(const s of people()){
    if(s.fixed||ST.with===s.id)continue;
    if(s.crashed)continue;
    s.temp=Math.min(100,s.temp+s.rate*dg*late);
    if(s.teacher){s.temp=Math.min(97,s.temp);continue;}
    if(s.temp>=100)crashStudent(s);
  }
  if(ST.panic>0)ST.panic=Math.max(0,ST.panic-dg);
  if(ST.down>0){L.downTime+=Math.min(dg,ST.down);ST.down-=dg;if(ST.down<=0){ST.down=0;ST.bat=35;L.recharges++;toast('重新開機完成，電量 35%。下次早點充電。');renderHud();}}
  for(const ev of ST.events){if(!ev.fired&&ST.t>=ev.at){ev.fired=true;fireEvent(ev.id);}}
  if(ST.t-ST.lastSample>=10){ST.lastSample=ST.t;ST.hist.push({t:Math.round(ST.t),bat:Math.round(ST.bat),T:Object.fromEntries(STU.map(s=>[s.id,s.fixed?null:Math.round(s.temp)]))});}
  if(ST.t>=600)ST.needEnd=true;
}
function crashStudent(s){
  s.crashed=true;s.wasCrashed=true;s.temp=100;s.rebooted=false;if(!L.crashed.includes(s.id))L.crashed.push(s.id);
  const others=STU.filter(o=>o!==s&&!o.fixed&&!o.crashed&&ST.with!==o.id);
  let o=null,bd=1e9;for(const c of others){const d=Math.abs(c.x-s.x)+Math.abs(c.y-s.y);if(d<bd){bd=d;o=c;}}
  if(o)o.temp=Math.min(100,o.temp+20);
  ST.shake=.6;
  toast(`${s.nm} 當機了！${o?`焦慮會傳染：離最近的 ${o.nm} +20°`:''}`,'bad');
  if(o&&o.temp>=100)crashStudent(o);
}
function addTime(sec){advance(sec);}

// ================= 走路、互動 =================
function goTo(tg){
  if(sheetOpen||ST.phase!=='play')return;
  if(ST.down>0){toast(`當機中……還要 ${Math.ceil(ST.down)} 秒才能動。`,'bad');return;}
  if(tg.kind==='npc'&&!tg.n.met&&!tg.n.fixed)ST.decision=snapshot(tg.n);
  const [px,py]=ppos();
  if(isAdj(tg,px,py)){player.path=[];interact(tg);return;}
  const p=bfs(px,py,(x,y)=>isAdj(tg,x,y));
  if(!p){toast('那裡走不過去。');return;}
  player.path=p;player.target=tg;
}
function snapshot(s){
  const open=STU.filter(o=>!o.fixed);if(!open.length)return null;
  const maxT=Math.max(...open.map(o=>o.crashed?100:o.temp));
  const d=open.map(o=>[o.id,pathLen(o)]);const minD=Math.min(...d.map(x=>x[1]));
  const my=(d.find(x=>x[0]===s.id)||[0,99])[1];
  return {id:s.id,t:Math.round(ST.t),temp:Math.round(s.temp),hottest:s.temp>=maxT-3,nearest:my<=minD+1,loud:!!s.loud,crashed:!!s.crashed};
}
function interact(tg){
  player.target=null;
  if(tg.kind==='bld'){openBuilding(tg.key);return;}
  openStudent(tg.n);
}

// ================= 對話框 =================
const $sheet=$('sheet'),$panel=$('panel');
function openSheet(html,kind){sheetOpen=true;sheetKind=kind||'dlg';$sheet.hidden=false;$panel.innerHTML=html;$panel.scrollTop=0;const f=$panel.querySelector('button:not(:disabled)');f&&f.focus({preventScroll:true});}
function closeSheet(){
  miniTok++;sheetOpen=false;sheetKind=null;ST.with=null;$sheet.hidden=true;renderHud();updateList();
  if(ST.phase==='play'&&ST.pendingCrash)crashPlayer();
}
function head(s){
  const tmp=s.fixed?'✓':Math.round(s.temp)+'°';
  return `<div class="ph"><span class="av">${faceSvg(s)}</span><div class="who"><b>${s.nm}<small>${s.tag}</small></b><code class="${s.fixed?'fixed':''}">${s.fixed?'✓ Fixed':s.err}</code></div><span class="tmp" id="htmp">${tmp}</span></div>`;
}
function btnRow(btns){return `<div class="row">${btns.map((b,i)=>`<button class="${b.cls||(i===0?'primary':'ghost')}" data-bi="${i}">${b.l}</button>`).join('')}</div>`;}
function bindRow(btns){$panel.querySelectorAll('[data-bi]').forEach(b=>b.onclick=()=>btns[+b.dataset.bi].fn());}
function say(who,text,btns,extra){
  openSheet(`${who?head(who):''}<div class="pb">${extra||''}<p class="say">${text}</p>${btnRow(btns)}</div>`);bindRow(btns);
}
function fxLine(d){return Object.entries(d).filter(([,v])=>v).map(([k,v])=>`${k} ${v>0?'+':''}${v}`).join(' · ');}

function openStudent(s){
  if(s.fixed){toast(`${s.nm}：看起來好多了。${s.teacher?'老師在哼歌。':'✓ Fixed'}`,'good');return;}
  if(!s.met){s.met=true;if(!s.teacher){const d=(ST.decision&&ST.decision.id===s.id)?ST.decision:snapshot(s);if(d)L.targets.push(d);if(L.toolsAtFirst==null){L.toolsAtFirst=toolCount();L.firstAt=ST.t;}}}
  ST.decision=null;ST.with=s.id;
  if(s.crashed&&!s.rebooted){stepReboot(s);return;}
  if(s.stage===0)stepApproach(s);else if(s.stage===1)stepWord(s);else stepTool(s);
}
function stepReboot(s){
  openSheet(`${head(s)}<div class="pb"><p class="see"><b>${s.nm} 當機了：</b>畫面卡住，現在什麼話都聽不進去。</p>
   <p class="say">（${s.prop==='hood'?'她把整張臉埋進膝蓋。':s.prop==='ball'?'她背對所有人，肩膀一直在抖。':s.prop==='phone'?'他把手機摔在椅子上，不笑了。':s.prop==='glasses'?'他直接戴上耳機，誰都不理。':'她把筆記本闔起來，趴在桌上。'}）</p>
   <span class="q">// 先別急著修。先讓他重新開機。</span>
   ${btnRow([{l:'先陪他待一下，不說話（20 秒，電量 −6）'},{l:'等一下再來'}])}</div>`);
  bindRow([{fn:()=>{addTime(20);useBat(6);s.rebooted=true;s.crashed=false;s.temp=85;if(s.stage===0)stepApproach(s,'他慢慢抬起頭。系統重新開機完成，但溫度還很高。');else if(s.stage===1)stepWord(s);else stepTool(s);}},{fn:closeSheet}]);
}
function stepApproach(s,pre){
  const low=ST.bat<30;
  const opts=s.apOrder.map(i=>Object.assign({i},s.ap[i]));
  openSheet(`${head(s)}<div class="pb">${pre?`<div class="fb"><p>${pre}</p></div>`:''}
    <p class="see"><b>你看到：</b>${s.see}</p><p class="say">${s.nm}：${s.says}</p>
    <span class="q">// step 1：你要怎麼開口？</span>
    <div class="opts">${opts.map(a=>`<button class="opt" data-i="${a.i}" data-g="${a.g}" data-k="${a.k}" ${low&&a.calm?'disabled':''}>${a.l}${low&&a.calm?'<small>電量低於 30%：沒力氣慢慢陪</small>':''}</button>`).join('')}</div>
    <div id="after"></div></div>`);
  $panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const a=s.ap[+b.dataset.i];
    $panel.querySelectorAll('.opt').forEach(x=>{x.disabled=true;});b.classList.add('pick','g-'+a.g);
    const eff={best:{t:-15,b:5,s:9},ok:{t:-6,b:7,s:11},bad:{t:12,b:10,s:11}}[a.g];
    s.temp=clamp(s.temp+eff.t,0,99);addTime(eff.s);useBat(eff.b);s.apG=a.g;s.stage=1;
    L.approaches.push({id:s.id,k:a.k,g:a.g});
    const msg=a.g==='best'?'他願意說了。':a.g==='ok'?'有打開一點點。':'他更不想講了……不過你還在，可以繼續。';
    $('after').innerHTML=`<div class="fb ${a.g==='best'?'good':a.g==='bad'?'bad':''}"><p>${a.r}</p><p><b>${msg}</b></p><span class="fx">溫度 ${eff.t>0?'+':''}${eff.t}° · 電量 −${eff.b} · 時間 +${eff.s}s</span></div>
      <button class="primary" id="nx" style="width:100%">下一步：讀懂${s.teacher?'老師':s.nm}的感覺</button>`;
    $('htmp').textContent=Math.round(s.temp)+'°';
    $('nx').onclick=()=>stepWord(s);$('nx').focus({preventScroll:true});
  });
}
function stepWord(s){
  ST.with=s.id;
  const low=ST.bat<30;
  let ws=s.words.map((w,i)=>({w:w[0],g:w[1],fb:w[2],i}));
  if(low){const near=ws.filter(w=>w.g==='near');ws=ws.filter(w=>w!==near[near.length-1]);}
  if(!s.wOrder)s.wOrder=shuffle(ws.map(w=>w.i));
  ws=s.wOrder.map(i=>ws.find(w=>w.i===i)).filter(Boolean);
  openSheet(`${head(s)}<div class="pb">
    <div class="clue"><div><i>身體訊號</i>${s.clue.body}</div><div><i>${s.teacher?'老師':'他'}說的話</i>${s.clue.words}</div></div>
    <span class="q">// step 2：哪個詞更貼近${s.teacher?'老師':s.nm}現在的感覺？</span>
    <div class="words">${ws.map(w=>`<button class="opt" data-i="${w.i}" data-g="${w.g}">${w.w}</button>`).join('')}</div>
    ${low?'<p class="small">電量低，腦袋只想得到 3 個詞。</p>':''}
    <div id="after"></div></div>`);
  $panel.querySelectorAll('.words .opt').forEach(b=>b.onclick=()=>{
    const w=s.words[+b.dataset.i],g=w[1];const exact=s.words.find(x=>x[1]==='exact')[0];
    $panel.querySelectorAll('.words .opt').forEach(x=>x.disabled=true);b.classList.add('pick');
    $panel.querySelectorAll('.words .opt').forEach(x=>{if(s.words[+x.dataset.i][1]==='exact')x.classList.add('g-best');});
    const eff={exact:-8,near:-4,far:4}[g];s.temp=clamp(s.temp+eff,0,99);addTime(6);useBat(2);s.wG=g;s.stage=2;
    L.words.push({id:s.id,g});
    let newPage=false;if(g==='exact'&&!PS.dict[exact]){PS.dict[exact]=true;saveP();newPage=true;}
    const title=g==='exact'?`就是「${exact}」。`:g==='near'?`很接近！更貼近的詞：「${exact}」`:`更貼近的詞：「${exact}」`;
    $('after').innerHTML=`<div class="fb ${g==='exact'?'good':''}"><p><b>${title}</b></p><p>${w[2]}</p>${newPage?`<p class="fx">情緒字典 +1 頁：${exact}</p>`:''}<span class="fx">溫度 ${eff>0?'+':''}${eff}° · 時間 +6s</span></div>
      <button class="primary" id="nx" style="width:100%">${s.teacher?'完成':'下一步：用工具修'}</button>`;
    $('htmp').textContent=Math.round(s.temp)+'°';
    $('nx').onclick=()=>s.teacher?finishTeacher(s):stepTool(s);$('nx').focus({preventScroll:true});
  });
}
function stepTool(s){
  ST.with=s.id;
  const t=s.tool,tn=TOOLS[t].nm;
  if(!ST.tools[t]){
    if(!s.asked)L.noTool++;s.asked=true;ST.toolAsk[t]=true;renderTools();
    openSheet(`${head(s)}<div class="pb"><span class="q">// step 3：需要工具「${tn}」</span><p class="say">${s.nm}：${s.miss}</p>
      <p class="small">你的背包裡沒有「${tn}」。地圖上的「？」會變成工具名稱。</p>${btnRow([{l:'好，我去拿'}])}</div>`);
    bindRow([{fn:closeSheet}]);return;
  }
  const NAMES={chunk:'拆任務',fact:'換個想法',ground:'5-4-3-2-1 著地',imsg:'我訊息',breath:'一起呼吸'};

    raf(fn){const loop=now=>{if(done||tok!==miniTok)return;fn(now);if(!done)raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);},
    bar(f){const b=$('mgT');if(b)b.style.width=clamp(f,0,1)*100+'%';},

// drag or tap a chip; works with finger and mouse
function dnd(chip,targets,onDrop,onTap){
  let pid=null,sx=0,sy=0,drag=false;
  chip.addEventListener('pointerdown',e=>{if(chip.disabled)return;e.preventDefault();pid=e.pointerId;sx=e.clientX;sy=e.clientY;drag=false;try{chip.setPointerCapture(pid);}catch(_){}});
  chip.addEventListener('pointermove',e=>{if(pid!==e.pointerId)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!drag&&Math.hypot(dx,dy)>8){drag=true;chip.classList.add('drag');}
    if(drag){chip.style.transform=`translate(${dx}px,${dy}px)`;targets().forEach(t=>t.classList.toggle('hi',hit(t,e)));}});
  const hit=(t,e)=>{const r=t.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;};
  chip.addEventListener('pointerup',e=>{if(pid!==e.pointerId)return;pid=null;
    if(drag){chip.classList.remove('drag');chip.style.transform='';const ts=targets();ts.forEach(t=>t.classList.remove('hi'));const t=ts.find(t=>hit(t,e));if(t)onDrop(chip,t);}
    else onTap(chip);});
  chip.addEventListener('pointercancel',()=>{pid=null;drag=false;chip.classList.remove('drag');chip.style.transform='';targets().forEach(t=>t.classList.remove('hi'));});
  chip.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap(chip);}});
}

function holdable(elm,onDown){
  let on=false;
  const down=e=>{if(on)return;on=true;elm.classList.add('on');if(e&&e.pointerId!=null){try{elm.setPointerCapture(e.pointerId);}catch(_){}}onDown&&onDown();};
  const up=()=>{if(!on)return;on=false;elm.classList.remove('on');};
  elm.addEventListener('pointerdown',e=>{e.preventDefault();down(e);});
  elm.addEventListener('pointerup',up);elm.addEventListener('pointercancel',up);elm.addEventListener('lostpointercapture',up);
  elm.addEventListener('contextmenu',e=>e.preventDefault());
  elm.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();down();}});
  elm.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();up();}});
  elm.tabIndex=0;return ()=>on;
}

      let a0=0,ph='in',pt=0,pl=2,round=1,idx=0;for(const [p,l] of SEQ){if(t<a0+l){ph=p;pt=t-a0;pl=l;break;}a0+=l;idx++;}round=Math.floor(idx/2)+1;

function star(cx,cy,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}ctx.closePath();ctx.fill();}

function drawPerson(n){

let last=0,kb=null,kbT=0,listT=0;
function onArrive(nx,ny){
  useBat(.35*(ST.panic>0?2:1));L.walked++;
  const k=nx+','+ny;if(STICKERS.some(([a,b])=>a===nx&&b===ny)&&!ST.stickers.includes(k)){ST.stickers.push(k);renderHud();toast(`找到好心情貼紙（${ST.stickers.length}/3）！${ST.stickers.length===3?'獲得「貼紙獵人」。':''}`,'good');}
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(ST.phase==='play'){
    const gs=dt*2;
    if(!sheetOpen&&ST.down<=0){
      if(player.path.length){const [nx,ny]=player.path[0];
        if(blocked(nx,ny)&&!(Math.round(player.x)===nx&&Math.round(player.y)===ny)){const t=player.target;player.path=[];if(t){const [px,py]=ppos();player.x=px;player.y=py;const p=bfs(px,py,(x,y)=>isAdj(t,x,y));if(p){player.path=p;}}}
        else{const dx=nx-player.x,dy=ny-player.y,d=Math.hypot(dx,dy),sp=(ST.bat<30?2.4:3.6)*(ST.panic>0?1.4:1)*dt;
          if(d<=sp){player.x=nx;player.y=ny;player.path.shift();onArrive(nx,ny);}else{player.x+=dx/d*sp;player.y+=dy/d*sp;}}}
      else if(player.target){const t=player.target;player.target=null;const [px,py]=ppos();if(isAdj(t,px,py))interact(t);}
      else if(kb){kbT-=dt;if(kbT<=0){step(kb);kbT=.15;}}
      if(!sheetOpen&&ST.evQ.length&&ST.phase==='play')openEvent(ST.evQ.shift());
    }
    advance(gs);
    if(ST.needEnd){ST.needEnd=false;endGame('bell');}
    listT-=dt;if(listT<=0){listT=.25;updateList();renderHud();
      if(sheetOpen&&ST.with){const s=people().find(p=>p.id===ST.with);const h=$('htmp');if(s&&h&&!s.fixed)h.textContent=Math.round(s.temp)+'°';}}
  }
  draw(dt);requestAnimationFrame(frame);
}

  if(sheetOpen||ST.phase!=='play')return;const r=cv.getBoundingClientRect();const fx=(ev.clientX-r.left)/ts,fy=(ev.clientY-r.top)/ts;const x=Math.floor(fx),y=Math.floor(fy);
  if(x<0||y<0||x>=W||y>=H)return;
  // 點到同學身上、頭上的溫度泡泡或名字，都算點到這位同學（手指比格子大）
  let n=null,bd=.8;const onBld=!!BINFO[grid[y][x]];
  for(const p of people()){for(const [hx,hy] of (onBld?[[p.x+.5,p.y+.5],[p.x+.5,p.y-.1]]:[[p.x+.5,p.y+.5],[p.x+.5,p.y-.1],[p.x+.5,p.y+1.1]])){const d=Math.hypot(fx-hx,fy-hy);if(d<bd){bd=d;n=p;}}}
  if(n){goTo({kind:'npc',n});return;}
  // 地點頭上的工具泡泡
  for(const k in BLD){const b=BLD[k];if(Math.hypot(fx-(b.x0+(b.x1-b.x0+1)/2),fy-b.y0)<.55){goTo({kind:'bld',key:k});return;}}
  const c=grid[y][x];
  if(BINFO[c]){goTo({kind:'bld',key:c});return;}
  if(!walkable(c))return;
  if(ST.down>0){toast(`當機中……還要 ${Math.ceil(ST.down)} 秒。`,'bad');return;}
  const p=bfs(...ppos(),(a,b)=>a===x&&b===y);if(p){player.path=p;player.target=null;}
});
const KM={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
window.addEventListener('keydown',e=>{
  if(sheetOpen){if(e.key==='Escape'&&(sheetKind==='dlg'))closeSheet();return;}
  if(ST.phase!=='play'||ST.down>0)return;
  if(KM[e.key]){e.preventDefault();if(kb!==KM[e.key]){kb=KM[e.key];player.target=null;if(!player.path.length){step(kb);kbT=.18;}}return;}
  if(e.key==='e'||e.key==='E'||e.key===' '){e.preventDefault();const [px,py]=ppos();
    const n=people().find(p=>adjTo(px,py,p.x,p.y));if(n){interact({kind:'npc',n});return;}
    for(const k in BLD)if(adjBld(BLD[k],px,py)){interact({kind:'bld',key:k});return;}}
});
window.addEventListener('keyup',e=>{if(KM[e.key]&&kb===KM[e.key])kb=null;});
window.addEventListener('resize',resize);
$('endEarly').addEventListener('click',()=>{if(!sheetOpen)endGame('early');});
resize();buildList();renderTools();renderHud();requestAnimationFrame(frame);showIntro();

// 給自動測試用
window.__mood={get ST(){return ST},get STU(){return STU},get TEACH(){return TEACH},get L(){return L},get player(){return player},get PS(){return PS},
  get sheetOpen(){return sheetOpen},get sheetKind(){return sheetKind},get report(){return lastReport},
  tileClient(x,y){const r=cv.getBoundingClientRect();return [r.left+(x+.5)*ts,r.top+(y+.5)*ts];},
  BLD,BINFO,TOOLS,STICKERS,goTo,endGame,reflection,pathLen};
})();
