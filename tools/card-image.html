<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>序列圖卡產生器</title>
<style>
/* 1080x1350 IG 直式圖卡。用法：/tools/card-image.html?zone=2026-10-shoulder，截圖 #card */
:root{--yellow:#ffc233;--tomato:#d7263d;--lettuce:#7fa63d;--ink:#2c2c2a;--stone:#888780;--cream:#efeae3;--soft:#f7f3ee}
html,body{margin:0;background:#ccc}
#card{width:1080px;height:1350px;background:var(--cream);position:relative;overflow:hidden;font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--ink);box-sizing:border-box}
.rib{height:44px;background:linear-gradient(90deg,var(--yellow) 0 32%,var(--tomato) 32% 57%,var(--ink) 57% 80%,var(--lettuce) 80% 100%)}
.in{padding:44px 64px 0}
.tag{display:inline-block;background:var(--tomato);color:#fff;font-weight:900;font-size:28px;padding:6px 22px;border-radius:99px;letter-spacing:.04em}
h1{font-size:76px;font-weight:900;margin:18px 0 4px;line-height:1.15}
.sub{font-size:32px;color:var(--stone);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.c{background:#fff;border:4px solid var(--ink);border-radius:28px;height:420px;position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 14px 18px;box-sizing:border-box;box-shadow:0 8px 0 var(--ink)}
.n{position:absolute;left:16px;top:14px;width:54px;height:54px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);font:900 30px Poppins,sans-serif;display:grid;place-items:center}
.c svg{width:240px;height:220px;margin-top:6px}
.c b{font-size:38px;font-weight:900;line-height:1.1}
.c i{font:500 22px Poppins,sans-serif;color:var(--stone);font-style:normal;margin:2px 0 6px}
.c p{margin:0;font-size:26px;text-align:center;line-height:1.3}
.foot{position:absolute;left:64px;right:64px;bottom:36px;display:flex;justify-content:space-between;align-items:flex-end;font-size:24px;color:var(--stone)}
.foot strong{font:700 30px Poppins,sans-serif;color:var(--ink);letter-spacing:.06em}
</style></head><body>
<div id="card"><div class="rib"></div><div class="in" id="in">載入中</div>
<div class="foot"><span>跟著做之前，先照自己的身體感覺調整。<br>這不是治療；身體有傷痛，請先詢問醫師。</span><span style="text-align:right"><strong>@sandywich.su</strong><br>Sandywich Yoga</span></div></div>
<script src="/town/figures.js"></script>
<script>
(async()=>{const id=new URLSearchParams(location.search).get('zone')||'2026-10-shoulder';
const [poses,z]=await Promise.all([fetch('/content/poses.json').then(r=>r.json()),fetch(`/content/zones/${id}.json`).then(r=>r.json())]);
const P={};for(const p of poses.poses)P[p.id]=p;
document.getElementById('in').innerHTML=`<span class="tag">三明治鎮・第 ${z.order} 區｜序列圖卡</span><h1>${z.card.title}</h1><p class="sub">${z.part}・照順序做，每個動作慢慢呼吸</p>
<div class="grid">${z.card.steps.map((s,i)=>{const p=P[s.pose]||{};return `<div class="c"><span class="n">${i+1}</span>${SWFig.poseSvg(p.figure)}<b>${p.name}</b><i>${p.en}</i><p>${s.say.replace(/，/g,"<br>")}</p></div>`}).join('')}</div>`;
document.body.dataset.ready=1;})();
</script></body></html>
