<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三明治鎮｜Sandywich Yoga</title>
<meta name="description" content="當一天三明治鎮的瑜伽老師，幫居民放鬆肩膀。">
<meta property="og:title" content="三明治鎮｜換你當瑜伽老師">
<meta property="og:description" content="幫居民放鬆肩膀，收集貼紙做出一個三明治。">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: phone column on cream — brand ribbon, title + sticker row, square town map (canvas), then the resident list. Lessons open in a sheet over the page. Deliberate single light theme in Sandywich brand colours. */
:root{
  --yellow:#ffc233; --tomato:#d7263d; --lettuce:#7fa63d; --ink:#2c2c2a; --stone:#888780;
  --cream:#efeae3; --white:#ffffff; --line:#ddd6cb; --soft:#f7f3ee;
  --grass:#dfe8cf; --grass2:#d3dfbf; --tree:#6f9433; --path:#f3ede4;
  --tomato-soft:#fbe3e6; --lettuce-soft:#e9f1dc; --yellow-soft:#fff1cc;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-en:"Poppins","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--cream)}
body{color:var(--ink);font-family:var(--f-zh);font-size:16px;line-height:1.65;margin:0}
.ribbon{height:22px;background:linear-gradient(90deg,var(--yellow) 0 32%,var(--tomato) 32% 57%,var(--ink) 57% 80%,var(--lettuce) 80% 100%);
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7.5px) 0 0/20px 100% repeat-x;
          mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7.5px) 0 0/20px 100% repeat-x}
.wrap{max-width:520px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 36px;display:flex;flex-direction:column;gap:10px}
h1,h2{margin:0;text-wrap:balance;font-weight:900}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:20px;font-weight:900}
.brand span{font-family:var(--f-en);font-size:11px;letter-spacing:.14em;color:var(--stone);text-transform:uppercase}
.albumBtn{border:2px solid var(--ink);background:var(--white);border-radius:16px;padding:4px 8px 4px 10px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.albumBtn .lbl{font-weight:900;font-size:13px;writing-mode:horizontal-tb;white-space:nowrap}
.albumBtn .dots{display:flex;gap:3px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:2px dashed var(--line)}
.dot.on{background:var(--yellow-soft);border:2px solid var(--ink)}
.dot svg{width:24px;height:24px}
.dot.off svg{opacity:.18;filter:grayscale(1)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--white);border-radius:14px;padding:6px 10px;box-shadow:0 1px 0 var(--line)}
.hud .h{font-size:12px;font-weight:900;color:var(--stone);letter-spacing:.06em}
.slot{display:flex;align-items:center;gap:4px;border-radius:10px;padding:2px 8px 2px 4px;background:var(--soft);font-size:13px;font-weight:700}
.slot svg{width:26px;height:26px}
.slot.off{color:var(--stone)}
.slot.off svg{opacity:.25;filter:grayscale(1)}
.slot.got{background:var(--yellow-soft)}
.slot.pop,.albumBtn.pop{animation:pop .6s ease 2}
.main{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.wrap{max-width:1000px}.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start;gap:16px}.stage{width:min(100%,calc(100vh - 190px));justify-self:center}.people{grid-template-columns:1fr}}
@media (min-width:700px) and (min-height:600px){.sheet{align-items:center}}
.albumBtn b{font-family:var(--f-en)}
.albumBtn.pop{animation:pop .6s ease 2}
@keyframes pop{50%{transform:scale(1.15)}}
.bag{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sticker.empty{background:var(--soft);border:2px dashed var(--line);color:var(--stone)}
.sticker.empty .q{font-size:28px;font-weight:900;padding:18px 0 8px}
.sticker small{font-size:11px;color:var(--stone);line-height:1.35}
.bag span{font-size:12px;font-weight:700;background:var(--white);border:2px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.bag span.on{border-color:var(--ink)}
.stage{position:relative;border-radius:18px;overflow:hidden;background:var(--grass);touch-action:manipulation;box-shadow:0 0 0 3px var(--ink)}
#cv{display:block;width:100%;height:auto}
.toast{pointer-events:none;position:absolute;left:10px;right:10px;bottom:10px;background:var(--white);border-radius:12px;padding:8px 12px;font-size:14px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4);transition:opacity .3s}
.list h2{font-size:16px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.list h2 span{font-size:12px;color:var(--stone);font-weight:500}
.people{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.who{display:flex;align-items:center;gap:8px;background:var(--white);border:0;border-radius:12px;padding:7px 10px;text-align:left;min-width:0}
.who .av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--white)}
.who .t{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.who .t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .t small{font-size:11px;color:var(--stone)}
.who.done{background:var(--lettuce-soft)}
.who.done small{color:var(--lettuce);font-weight:700}
.help{font-size:12px;color:var(--stone);margin:0}
.foot{font-size:12px;color:var(--stone);margin:0;text-align:center}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(44,44,42,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20}
.panel{background:var(--white);border-radius:22px;width:100%;max-width:500px;max-height:100%;overflow:auto;display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.ph .av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--white)}
.ph b{font-size:17px}
.ph small{display:block;font-size:12px;color:var(--stone);line-height:1.2}
.figbox{position:relative;background:var(--soft);margin:12px 16px 0;border-radius:16px;overflow:hidden}
.figbox svg{display:block;width:100%;height:min(34vh,300px);transition:opacity .3s}
.figbox .tag{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:var(--white);border-radius:99px;padding:2px 10px}
.breath{position:absolute;right:12px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:2px}
.breath .ring{width:42px;height:42px;border-radius:50%;background:var(--lettuce);opacity:.85;transform:scale(.55);transition:transform 2.4s ease-in-out}
.breath .ring.in{transform:scale(1)}
.breath span{font-size:13px;font-weight:900}
.pb{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.say{margin:0;font-size:17px;background:var(--soft);border-radius:4px 16px 16px 16px;padding:10px 14px}
.lead{margin:0;font-size:16px}
.pname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pname h2{font-size:24px;line-height:1.2}
.pname span{font-family:var(--f-en);font-size:13px;color:var(--stone)}
.eyebrow{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:99px;background:var(--tomato);color:var(--white)}
.primary{background:var(--ink);color:var(--white);border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px}
.ghost{background:var(--white);border:2px solid var(--line);border-radius:14px;padding:11px 16px;font-weight:700}
.link{background:none;border:0;color:var(--stone);text-decoration:underline;font-size:14px;align-self:center;padding:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--white);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:16px}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--lettuce);background:var(--lettuce-soft)}
.opt.wrong{border-color:var(--tomato);background:var(--tomato-soft)}
.opt:disabled{cursor:default}
.fact{background:var(--yellow-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fact b{font-size:15px}
.fact p{margin:0;font-size:15px}
.tip{display:flex;gap:10px;align-items:flex-start;border-top:2px dashed var(--line);padding-top:10px}
.tip i{flex:none;font-style:normal;font-size:12px;font-weight:900;background:var(--lettuce);color:var(--white);border-radius:99px;padding:2px 8px;margin-top:3px}
.tip p{margin:0;font-size:15px}
.pat{align-self:center;width:130px;height:130px;border-radius:50%;border:0;background:var(--yellow);font-weight:900;font-size:22px;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.pat:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.patmsg{text-align:center;font-size:20px;font-weight:900;min-height:1.6em;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sticker{border-radius:16px;background:var(--yellow-soft);border:2px solid var(--ink);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.sticker svg{width:100%;height:auto}
.sticker .ing{width:64%;max-width:90px;height:auto}
.sticker .pose{width:80%;max-width:110px;height:auto;margin-top:-6px}
.sandwich{display:flex;justify-content:center}
.sandwich svg{width:min(240px,70%);height:auto}
.sticker b{font-size:13px;line-height:1.3}
.sticker.badge{background:var(--lettuce-soft)}
.copied{font-size:13px;color:var(--lettuce);min-height:1.2em}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.breath .ring{transition:none}}
/* v2：時鐘、體力、緊繃值、小遊戲 */
.hud{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.clock{position:relative;display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.clock b{font-family:var(--f-en);font-size:24px;font-weight:700;letter-spacing:.02em}
.clock .day{display:block;width:72px;height:5px;border-radius:3px;background:var(--soft);margin-top:4px;overflow:hidden}
.clock .day i{display:block;height:100%;width:0;background:var(--ink)}
.plus{position:absolute;left:78px;top:0;font-size:13px;font-weight:900;color:var(--tomato);opacity:0;white-space:nowrap;pointer-events:none}
.plus.on{animation:plus 1.6s ease}
@keyframes plus{0%{opacity:0;transform:translateY(4px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.meter{display:flex;align-items:center;gap:6px;min-width:0}
.meter .bar{flex:1;height:12px;border-radius:7px;background:var(--soft);border:2px solid var(--ink);overflow:hidden;min-width:60px}
.meter .bar i{display:block;height:100%;width:100%;background:var(--lettuce);transition:width .25s}
.meter b{font-family:var(--f-en);font-size:14px;min-width:2.2em;text-align:right}
.bagrow{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.slot.rain{background:#dbe7f3;color:#3d6a9a}
.toast.warn{background:var(--tomato-soft);border:2px solid var(--tomato);font-weight:700}
.toast.event{background:var(--yellow-soft);border:2px solid var(--ink);font-weight:700}
.who{flex-direction:row}
.who .t{flex:1}
.tb{display:block;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:3px}
.tb i{display:block;height:100%;width:0;transition:width .25s}
.who.saved{background:var(--lettuce-soft)}
.who.saved small{color:var(--lettuce);font-weight:700}
.who.stuck{background:#e6e3de;opacity:.8}
.who.stuck small{color:var(--stone);font-weight:700}
.who.hot{box-shadow:0 0 0 2px var(--tomato)}
.who.saved .tb,.who.stuck .tb,.who.away .tb{display:none}
.who.away{background:var(--soft);opacity:.7}
.who.away small{font-weight:700}
.sk .nr{font-size:11px;color:var(--stone);font-weight:500}
.ph .pw{flex:1;min-width:0}
.tb.big{height:8px;margin-top:4px;max-width:200px}
.tn{font-size:11px!important}
.bubble{margin:10px 16px 0;background:var(--yellow-soft);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:15px}
.bubble:empty{display:none}
.figbox.drag,.figbox.hold{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.figbox.hold{cursor:pointer}
.figbox svg .handle{filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.hint{margin:0;font-size:12px;color:var(--stone)}
.note{margin:0;font-size:14px;color:var(--stone)}
.note.warn{color:var(--tomato);font-weight:700}
.cost{display:inline-block;margin-left:8px;font-size:12px;color:var(--stone);font-weight:500}
.ap button{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.ap button small{font-size:12px;font-weight:500;opacity:.8}
.primary.alt{background:var(--tomato)}
.gauge{position:absolute;right:12px;top:12%;height:72%;width:22px;border-radius:12px;background:var(--white);border:2px solid var(--ink);overflow:hidden}
.gauge .band{position:absolute;left:0;right:0;background:var(--lettuce);opacity:.75}
.gauge .needle{position:absolute;left:-2px;right:-2px;height:6px;margin-bottom:-3px;background:var(--ink);border-radius:3px}
.gauge .needle.out{background:var(--tomato)}
.figbox .breath{left:12px;right:auto;top:38px;bottom:auto}
.breath .ring{transition:none}
.peek{position:absolute;left:44%;top:6px;width:44px;animation:pk .5s ease}
.peek svg{width:44px;height:44px}
@keyframes pk{from{transform:translateY(-10px);opacity:0}}
.holdpad{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;border:3px solid var(--ink);background:var(--yellow);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 var(--ink);min-height:84px;justify-content:center}
.holdpad b{font-size:22px;font-weight:900}
.holdpad small{font-size:13px}
.holdpad.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:#ffd566}
.grade{align-self:flex-start;font-size:22px;font-weight:900;padding:2px 14px;border-radius:12px}
.grade.perfect{background:var(--yellow);border:2px solid var(--ink)}
.grade.pass{background:var(--lettuce-soft);color:#4e6d1f}
.grade.fail{background:var(--tomato-soft);color:var(--tomato)}
.benchring{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
.benchring .ring{width:110px;height:110px;border-radius:50%;background:var(--lettuce);opacity:.85;transform:scale(.5)}
.benchring span{font-weight:900}
.rules{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.rules li{background:var(--soft);border-radius:12px;padding:8px 12px}
.rules b{display:inline-block;margin-right:6px;color:var(--tomato)}
.end h2.big{font-size:30px;line-height:1.15}
.stuckL{display:flex;flex-direction:column;gap:6px;background:#eeebe6;border-radius:14px;padding:10px 12px}
.stuckL>b{font-size:13px;color:var(--stone)}
.sk{display:flex;gap:10px;align-items:center}
.sk .mi{width:34px;height:34px;flex:none}
.sk span{display:flex;flex-direction:column;line-height:1.3}
.sk small{font-size:13px;color:var(--ink)}
.style{border:2px solid var(--ink);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--white)}
.style>small{font-size:12px;color:var(--stone);font-weight:700;letter-spacing:.06em}
.style h3{margin:0;font-size:24px;font-weight:900;color:var(--tomato)}
.style ul{margin:0;padding-left:20px;font-size:15px}
.cost2{margin:0;font-size:14px;color:var(--stone)}
.nw{background:var(--ink);color:var(--white);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.nw>small{font-size:13px;color:var(--yellow);font-weight:700}
.nw h3{margin:0;font-size:22px;font-weight:900;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.nw h3 span{font-size:13px;font-weight:500;color:#d8d3ca}
.nw p{margin:0;font-size:15px}
.nw .parts{font-size:13px;color:#d8d3ca}
.nw .follow{font-weight:900;color:var(--yellow)}
.nw a.primary{background:var(--yellow);color:var(--ink);text-decoration:none;text-align:center}
.cardlink{font-size:14px;font-weight:700;color:var(--ink)}
.disc{margin:0;font-size:12px;color:var(--stone);text-align:center}
h3.sec{margin:6px 0 0;font-size:16px;font-weight:900}
.mon{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px}
.mon .mbig{width:64px;height:64px;flex:none}
.mon p{margin:2px 0;font-size:14px}
.mon small{font-size:12px;color:var(--stone)}
.mon.locked .mbig{filter:grayscale(1) brightness(.4);opacity:.4}
.sticker.lock{background:var(--soft);border:2px dashed var(--line);color:var(--stone)}
.sticker.badge small{font-size:11px}
@media (prefers-reduced-motion:reduce){.plus.on,.peek{animation:none}.meter .bar i,.tb i{transition:none}}
@media (min-width:900px){.stage{width:min(100%,calc(100vh - 250px))}.people{grid-template-columns:1fr}.hud{grid-template-columns:auto minmax(0,1fr) auto}.bagrow{grid-column:auto}}

.pass{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pass b{font-size:26px;font-weight:900;letter-spacing:.1em}
.pass small{font-size:13px;color:var(--stone)}
.pass a.primary{text-decoration:none;margin-top:6px;align-self:stretch}
.home{font-size:13px;color:var(--stone);text-decoration:none;font-weight:700}

/* v3：任務頁、貼紙簿、結尾、穩住提示。字級只用這幾種：頁標題 22、區塊標題 15、卡片標題 14、說明 12。 */
.goal{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:var(--yellow-soft);border-radius:10px;padding:4px 10px}
.goal b{color:var(--tomato);font-size:15px}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.pips i.on{background:var(--lettuce)}
.bigcue{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:18px;font-weight:900;padding:4px 14px;border-radius:99px;white-space:nowrap;pointer-events:none;border:2px solid var(--ink)}
.bigcue.in{background:var(--yellow)}
.bigcue.out{background:var(--white)}
.figbox.hold .tag{top:auto;bottom:10px}
.figbox.hold .breath{top:52px}
.holdpad{position:relative}
.holdpad .pt{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;background:var(--tomato);color:var(--white);padding:2px 10px;border-radius:99px;white-space:nowrap;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,4px)}}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.primary.big{font-size:19px;padding:16px}
.h2{font-size:22px;line-height:1.25}
.goals .glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.glist li{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:8px 12px}
.glist .gi{flex:none;width:40px;height:40px;display:grid;place-items:center}
.glist .gi svg{width:40px;height:40px}
.glist div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.glist b{font-size:14px;font-weight:700;line-height:1.35}
.glist small{font-size:12px;color:var(--stone);line-height:1.4}
.glist em{flex:none;font-style:normal;font-family:var(--f-en);font-weight:700;font-size:14px;min-width:2.4em;text-align:right}
.glist em.ok{color:var(--lettuce)}
.minis{display:flex;gap:3px}
.mini{width:20px;height:20px;opacity:.25;filter:grayscale(1)}
.mini.on{opacity:1;filter:none}
.mini svg{width:20px;height:20px}
.howto{border:2px dashed var(--line);border-radius:14px;padding:8px 12px}
.howto>b{font-size:15px;font-weight:900}
.howto ul{margin:4px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.alb section{display:flex;flex-direction:column;gap:8px}
.alb .sec,.goals .sec{margin:0;font-size:15px;font-weight:900;display:flex;align-items:baseline;gap:8px}
.cnt{font-family:var(--f-en);font-size:13px;font-weight:700;color:var(--stone)}
.cap{margin:0;font-size:12px;color:var(--stone)}
.card{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.card b{font-size:14px;font-weight:700;line-height:1.35}
.card small{font-size:12px;color:var(--stone);line-height:1.4}
.card em{font-style:normal;font-weight:700;color:var(--ink)}
.card.off{opacity:.72}
.copied:empty{display:none}
.holdpad.exh{background:var(--white)}
.holdpad.exh.on{background:#ffe9a8}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cards5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.card.st{align-items:center;text-align:center;padding:8px 4px;background:var(--yellow-soft);border:2px solid var(--ink)}
.card.st.off{background:var(--soft);border:2px dashed var(--line);opacity:1}
.card.st.off .ic{opacity:.18;filter:grayscale(1)}
.card.st .ic{width:36px;height:36px}
.card.st b,.card.st small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card.bd{align-items:center;text-align:center;padding:10px 6px}
.card.bd .medal{width:34px;height:34px}
.card.bd.off .medal{opacity:.7}
.card.bd .new{position:absolute;top:6px;right:6px;font-size:11px;font-weight:900;background:var(--tomato);color:var(--white);border-radius:99px;padding:0 6px}
.card.mon{flex-direction:row;gap:12px;align-items:flex-start}
.card.mon .mbig{width:56px;height:56px;flex:none}
.card.mon>div{display:flex;flex-direction:column;gap:3px}
.card.mon.off .mbig{filter:grayscale(1) brightness(.4);opacity:.4}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:12px;font-weight:700;background:var(--white);border:2px solid var(--line);border-radius:99px;padding:2px 10px}
.chips span.on{border-color:var(--ink)}
.sandwich.sm svg{width:min(180px,55%)}
.ttl{display:flex;flex-direction:column;gap:2px}
.ttl small{font-size:12px;color:var(--stone)}
.ttl b{font-size:22px;font-weight:900;color:var(--tomato)}
.newb{background:var(--lettuce-soft);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.newb .nbh{font-size:15px;font-weight:900}
.newb>small{font-size:12px;color:#4e6d1f}
.newb .card{background:var(--white)}
.lock{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.lock>b{font-size:17px;font-weight:900}
.lock>small{font-size:12px;color:var(--stone)}
.lock ul{margin:2px 0 0;padding-left:20px;font-size:14px}
.nw .igbtn{margin-top:4px}
a.primary{display:block;text-align:center;text-decoration:none}
.qr{display:flex;align-items:center;gap:12px;background:var(--white);color:var(--ink);border-radius:12px;padding:8px;margin-top:4px}
.qr #qrc img,.qr #qrc canvas{display:block;width:132px;height:132px}
.qr small{font-size:13px;font-weight:700}
.sec2{display:flex;flex-direction:column;gap:6px}
.ghost.sm{font-size:14px;padding:8px 12px;border-radius:12px}
</style>
</head>
